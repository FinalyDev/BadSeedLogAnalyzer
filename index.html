<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warrior Scorecard</title>
<link rel="icon" href="https://wow.zamimg.com/images/wow/icons/large/classicon_warrior.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>const whTooltips = { colorLinks: false, iconizeLinks: false, renameLinks: false };</script>
<script src="https://wow.zamimg.com/js/tooltips.js"></script>
<style>
  :root {
    --bg: #110e0b; --panel: #1c1712; --panel2: #241d17; --line: #3a3027; --text: #ece3d6; --muted: #a8998a;
    --warrior: #c79c6e; --gold: #e6b450; --bad: #e0605a;
    --dps: #c79c6e; --sunder: #7aa6d6; --demo: #b48ad6; --disarm: #d6a96a;
    /* Warcraft Logs parse colors */
    --t-legend: #e5cc80; --t-orange: #ff8000; --t-purple: #a335ee; --t-blue: #0070dd; --t-green: #1eff00; --t-gray: #9d9d9d;
  }
  * { box-sizing: border-box; }
  html, body { overflow-x: clip; }
  body { margin: 0; background: radial-gradient(ellipse at top, #2a1f15 0%, var(--bg) 60%) fixed; color: var(--text);
         font: 15px/1.5 Inter, system-ui, sans-serif; }
  main { max-width: 920px; margin: 0 auto; padding: 24px 16px 64px; }
  a { color: inherit; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .brand img { width: 44px; height: 44px; border-radius: 8px; border: 2px solid var(--warrior); box-shadow: 0 0 18px rgba(199,156,110,.35); }
  h1 { font-family: Cinzel, serif; color: var(--warrior); margin: 0; font-size: 28px; letter-spacing: .02em; }
  .sub { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > * { flex: 1 1 200px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; text-transform: uppercase; letter-spacing: .04em; }
  input, select { width: 100%; padding: 10px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  input:focus, select:focus { outline: 2px solid var(--warrior); outline-offset: -1px; }
  button { padding: 10px 16px; background: linear-gradient(#d8ad7c, #a97f53); color: #1a120a; border: 0; border-radius: 6px;
           font: 600 15px Inter, sans-serif; cursor: pointer; }
  button.ghost { background: transparent; color: var(--warrior); border: 1px solid var(--warrior); }
  button:disabled { opacity: .5; cursor: default; }
  details summary { cursor: pointer; color: var(--warrior); font-weight: 600; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .status { margin-top: 10px; font-size: 14px; color: var(--muted); min-height: 1.5em; }
  .status.err { color: var(--bad); }

  /* icons */
  .ico { width: 28px; height: 28px; border-radius: 5px; border: 1px solid #000; box-shadow: 0 0 0 1px var(--line); vertical-align: middle; flex: none; }
  .ico.sm { width: 22px; height: 22px; }
  a.spell { display: inline-flex; line-height: 0; border-radius: 6px; }
  a.spell:hover .ico { box-shadow: 0 0 0 1px var(--gold), 0 0 10px rgba(230,180,80,.5); }

  /* tooltips (hover on desktop, tap on mobile) */
  .tip { position: relative; cursor: help; border-bottom: 1px dotted var(--muted); }
  .tip.bare { border: 0; }
  .tip::after {
    content: attr(data-tip); position: absolute; left: 0; bottom: calc(100% + 8px); z-index: 20;
    width: max-content; max-width: min(280px, 80vw); padding: 8px 10px; white-space: normal;
    background: #070b1c; border: 1px solid #5c6a96; border-radius: 4px; color: #fff;
    font: 400 12.5px/1.45 Inter, sans-serif; text-transform: none; letter-spacing: 0;
    box-shadow: 0 6px 20px rgba(0,0,0,.6); pointer-events: none; display: none;
  }
  .tip:hover::after, .tip:focus::after { display: block; }
  .score.tip::after, .bar.tip::after, .w .tip::after { left: auto; right: 0; }
  .tip:focus { outline: none; }

  /* legend */
  .legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; }
  .chip { display: flex; align-items: center; gap: 10px; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .chip b { display: block; font-size: 14px; }
  .chip small { color: var(--muted); font-size: 12px; }
  .chip .w { margin-left: auto; font: 600 18px Cinzel, serif; }
  .tiers { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .tiers span::before { content: '●'; margin-right: 4px; color: var(--c); }

  /* cards */
  .card { background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); border-radius: 12px;
          padding: 14px 16px; margin-bottom: 10px; border-left: 4px solid var(--tier, var(--line)); }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
  .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .rank { font: 700 16px Cinzel, serif; color: var(--muted); width: 26px; text-align: center; }
  .name { font-family: Cinzel, serif; font-size: 18px; font-weight: 700; color: var(--warrior); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .score { font: 700 30px Cinzel, serif; color: var(--tier); text-shadow: 0 0 14px color-mix(in srgb, var(--tier) 40%, transparent); }
  .comp { display: grid; grid-template-columns: 28px 76px 1fr 34px; gap: 4px 10px; align-items: center; margin-top: 10px; font-size: 13px; }
  .comp .lbl { font-weight: 500; }
  .bar { height: 10px; background: #0b0907; border: 1px solid #000; border-radius: 5px; overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 4px; box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }
  .num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .detail { grid-column: 3 / 5; color: var(--muted); font-size: 12px; margin-top: -4px; }
  .na { color: var(--muted); font-style: italic; }
  .dim .ico { filter: grayscale(1) brightness(.6); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  th { color: var(--muted); font-weight: 500; }
  th .ico { margin: 0 auto; display: block; }
  .scroll { overflow-x: auto; }
  /* compact, screenshot-friendly scorecard */
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 20px 0 8px; }
  .toolbar .hint { margin: 0; }
  button.small { padding: 6px 12px; font-size: 13px; }
  .shot { background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .shot-head { display: flex; gap: 10px; align-items: center; margin-bottom: 6px; }
  .shot-head img { width: 34px; height: 34px; border-radius: 6px; border: 1px solid var(--warrior); }
  .shot-title { font: 700 17px/1.2 Cinzel, serif; color: var(--warrior); }
  .shot-sub { font-size: 11.5px; color: var(--muted); }
  table.ct { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 13px; }
  .ct th { color: var(--muted); font: 500 10px Inter, sans-serif; padding: 4px 2px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .ct th.l, .ct td.nm { text-align: left; }
  .ct th a.spell, .ct th .tip { display: block; width: 20px; margin: 0 auto 2px; }
  .ct th .ico { width: 20px; height: 20px; display: block; }
  .ct td { padding: 5px 2px; border-bottom: 1px solid rgba(58,48,39,.55); text-align: center; vertical-align: middle; white-space: nowrap; }
  .ct tr:last-child td { border-bottom: 0; }
  .ct .rk { width: 26px; } .ct .sc { width: 48px; } .ct .cc { width: 40px; }
  .ct tr.r td.rk { box-shadow: inset 3px 0 0 var(--tier); font-weight: 600; color: var(--muted); }
  .ct td.nm { overflow: hidden; text-overflow: ellipsis; }
  .nm b { font-weight: 600; color: var(--warrior); }
  .nm small { display: block; font-size: 10.5px; line-height: 1.3; color: var(--muted); white-space: normal; }
  .ct td.sc { font: 700 17px Cinzel, serif; color: var(--tier); }
  .cv { font-weight: 600; font-variant-numeric: tabular-nums; }
  .mini { height: 3px; background: #0b0907; border-radius: 2px; margin: 3px 5px 0; overflow: hidden; }
  .mini > i { display: block; height: 100%; }
  .shot-foot { font-size: 10.5px; color: var(--muted); margin-top: 8px; text-align: center; }
  details.more { margin-top: 14px; }
  details.more > summary { margin-bottom: 10px; }
  /* Gargul gold split */
  .gk h2 { margin: 0 0 4px; }
  .gk .lead { color: var(--muted); font-size: 13px; margin: 0 0 6px; }
  .gk-slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0 10px; }
  .gk-slots label { margin: 6px 0 3px; text-transform: none; letter-spacing: 0; font-size: 12.5px; color: var(--text); }
  .gk-slots label b { color: var(--gold); font-weight: 600; margin-left: 4px; }
  .gk-slots select { padding: 7px; }
  .gk-wrap { overflow-x: auto; margin: 12px -4px 0; }
  table.gk-t { width: 100%; min-width: 330px; border-collapse: collapse; font-size: 13px; }
  .gk-t th { font: 500 10.5px Inter, sans-serif; color: var(--muted); text-align: center; padding: 4px 3px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .gk-t th.l { text-align: left; }
  .gk-t td { padding: 5px 3px; border-bottom: 1px solid rgba(58,48,39,.55); text-align: center; vertical-align: middle; }
  .gk-t td.pn { text-align: left; width: 100%; }
  .gk-t .pg { display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
  .gk-t .pg > b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .gk-t .pg .gold { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--gold); white-space: nowrap; }
  .gk-t td.pn small { display: block; font-size: 10.5px; color: var(--muted); line-height: 1.3; }
  .gk-t td.pn small.bon { color: #d8c49a; }
  .gk-t select { padding: 4px 2px; font-size: 12px; width: 64px; }
  .gk-t input[type=number] { padding: 4px; font-size: 12px; width: 52px; }
  .gk-t input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--warrior); }
  .gk-t tr.off td:not(:first-child) { opacity: .35; }
  .gk-sum { margin: 12px 0 10px; font-size: 13px; line-height: 1.6; }
  .gk-sum b { color: var(--gold); }
  .gk-sum .warn { color: var(--bad); }
  .gk textarea { width: 100%; margin-top: 10px; background: var(--bg); color: var(--text); border: 1px solid var(--line);
                 border-radius: 6px; padding: 8px; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  h2 { font-family: Cinzel, serif; color: var(--warrior); font-size: 20px; margin: 24px 0 10px; }
</style>
</head>
<body>
<main>
  <div class="brand">
    <img src="https://wow.zamimg.com/images/wow/icons/large/classicon_warrior.jpg" alt="" onerror="this.style.display='none'">
    <h1>Warrior Scorecard</h1>
  </div>
  <p class="sub">Ranks DPS warriors by damage <i>and</i> the debuffs the raid depends on. Hover or tap anything for details.</p>

  <div class="panel">
    <div id="legend" class="legend"></div>
    <div class="tiers">
      <span style="--c:var(--t-legend)">100</span><span style="--c:var(--t-orange)">95+</span><span style="--c:var(--t-purple)">75+</span>
      <span style="--c:var(--t-blue)">50+</span><span style="--c:var(--t-green)">25+</span><span style="--c:var(--t-gray)">&lt;25</span>
    </div>
  </div>

  <div class="panel">
    <label for="report">Report URL or code</label>
    <div class="row">
      <input id="report" placeholder="https://vanilla.warcraftlogs.com/reports/AbCd1234…">
      <button id="runBtn" style="flex:0 0 auto">Analyze</button>
    </div>
    <div id="status" class="status"></div>

    <details style="margin-top:12px">
      <summary>Settings & roles</summary>
      <label for="host">Log site</label>
      <select id="host">
        <option value="https://vanilla.warcraftlogs.com" selected>vanilla.warcraftlogs.com</option>
        <option value="https://classic.warcraftlogs.com">classic.warcraftlogs.com</option>
        <option value="https://fresh.warcraftlogs.com">fresh.warcraftlogs.com</option>
        <option value="https://sod.warcraftlogs.com">sod.warcraftlogs.com</option>
      </select>
      <label for="fightSet">Fights to analyze</label>
      <select id="fightSet">
        <option value="killsTrash">Boss kills + trash</option>
        <option value="all">Everything (incl. boss wipes)</option>
        <option value="kills">Boss kills only</option>
        <option value="trash">Trash only</option>
      </select>
      <label for="tanks">Tanks (excluded from ranking)</label><input id="tanks" placeholder="Name, Name">
      <label for="sunder">On sunder duty (blank = every DPS warrior)</label><input id="sunder" placeholder="Name, Name">
      <label for="demo">On Demo Shout</label><input id="demo" placeholder="Name">
      <div class="row">
        <div><label for="disarmTarget">Disarms per pull for full marks</label><input id="disarmTarget" type="number" value="1" min="1"></div>
        <div><label for="topN">Show top</label><input id="topN" type="number" value="6" min="1"></div>
      </div>
      <div class="hint">Saved in this browser only.</div>
    </details>
  </div>

  <div id="results"></div>
  <div id="gdkp"></div>
</main>

<script>
/* ───────── config ───────── */
const CFG = {
  WEIGHTS: { dps: 0.60, sunder: 0.25, demo: 0.10, disarm: 0.05 },
  SPELLS: { sunder: 11597, demo: 11556, disarm: 676 },
  SUNDER_REFRESH_S: 25, EARLY_WINDOW_S: 20, EARLY_BONUS: 1.5,
  DEMO_FULL_UPTIME: 0.90,
};
const WOWHEAD = 'https://www.wowhead.com/classic/spell=';
const ICON = n => `https://wow.zamimg.com/images/wow/icons/large/${n}.jpg`;
const ICON_FALLBACK = ICON('inv_misc_questionmark');

const COMPONENTS = [
  { key: 'dps', label: 'DPS', color: 'var(--dps)', icon: 'ability_warrior_savageblow', spell: null,
    tip: 'Your DPS ÷ the top warrior\'s DPS on each pull, averaged by fight length. Top DPS = 100.' },
  { key: 'sunder', label: 'Sunder', color: 'var(--sunder)', icon: 'ability_warrior_sunder', spell: CFG.SPELLS.sunder,
    tip: 'Useful sunders vs. your share of what the raid needed (5 stacks + a refresh every 25s). Only effective sunders count: ones that add a stack, or refresh a 5-stack that was about to fall off. Sunders in the first 20s count 1.5×.' },
  { key: 'demo', label: 'Demo', color: 'var(--demo)', icon: 'ability_warrior_warcry', spell: CFG.SPELLS.demo,
    tip: 'Demoralizing Shout uptime on the boss. 90%+ uptime = 100. Only scored for the warrior assigned to it.' },
  { key: 'disarm', label: 'Disarm', color: 'var(--disarm)', icon: 'ability_warrior_disarm', spell: CFG.SPELLS.disarm,
    tip: 'Successful disarms on every pull, boss and trash, for every DPS warrior. Landing the set number of disarms per pull = 100.' },
];

// Your Cloudflare Worker address, e.g. 'https://wcl-relay.yourname.workers.dev'
const RELAY_URL = 'https://withered-pine-036b.edtruong64.workers.dev';
const FIELDS = ['host', 'fightSet', 'tanks', 'sunder', 'demo', 'disarmTarget', 'topN', 'report'];
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem('ws_' + k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('ws_' + k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem('ws_' + k); } catch (e) {} },
};
const names = s => s.split(',').map(x => x.trim()).filter(Boolean);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ───────── icons & tooltips ───────── */
function iconImg(name, cls) {
  return `<img class="ico ${cls || ''}" src="${ICON(name)}" alt="" loading="lazy" onerror="this.onerror=null;this.src='${ICON_FALLBACK}'">`;
}
// Spell icons link to Wowhead so its tooltip script shows the real in-game tooltip
function spellIcon(c, cls) {
  const img = iconImg(c.icon, cls);
  return c.spell
    ? `<a class="spell" href="${WOWHEAD}${c.spell}" target="_blank" rel="noopener" data-wh-icon-size="medium">${img}</a>`
    : `<span class="tip bare" tabindex="0" data-tip="${esc(c.tip)}">${img}</span>`;
}
function refreshWowhead() {
  try { if (window.$WowheadPower) window.$WowheadPower.refreshLinks(); } catch (e) {}
}
function tierColor(v) {
  if (v >= 99.5) return 'var(--t-legend)';
  if (v >= 95) return 'var(--t-orange)';
  if (v >= 75) return 'var(--t-purple)';
  if (v >= 50) return 'var(--t-blue)';
  if (v >= 25) return 'var(--t-green)';
  return 'var(--t-gray)';
}

$('legend').innerHTML = COMPONENTS.map(c => `
  <div class="chip">
    ${spellIcon(c)}
    <div><b class="tip" tabindex="0" data-tip="${esc(c.tip)}">${c.label}</b><small>${c.spell ? 'Hover icon for spell' : 'Damage done'}</small></div>
    <span class="w" style="color:${c.color}">${Math.round(CFG.WEIGHTS[c.key] * 100)}%</span>
  </div>`).join('');

/* ───────── settings ───────── */
if (!store.get('v3')) { store.del('host'); store.del('clientId'); store.set('v3', '1'); } // default to vanilla once
FIELDS.forEach(f => {
  const v = store.get(f); if (v !== null) $(f).value = v;
  $(f).addEventListener('change', () => store.set(f, $(f).value));
});

function openSettings() { document.querySelector('details').open = true; }
['token', 'tokenExp', 'refresh'].forEach(k => store.del(k)); // old sign-in leftovers

/* ───────── API ───────── */
async function gql(query, variables) {
  if (!RELAY_URL) throw new Error('Relay not set up yet — put your Cloudflare Worker address in RELAY_URL.');
  let res;
  try {
    res = await fetch(RELAY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, variables, host: $('host').value.replace(/^https:\/\/|\.warcraftlogs\.com$/g, '') }),
    });
  } catch (e) {
    throw new Error('Could not reach the relay. Check RELAY_URL and that ALLOWED_ORIGIN matches this site.');
  }
  const body = await res.json().catch(() => ({ errors: [{ message: 'Relay returned ' + res.status }] }));
  if (body.errors) throw new Error(body.errors.map(e => e.message).join('; '));
  if (!body.data || !body.data.reportData || !body.data.reportData.report) throw new Error('Report not found — is it private?');
  return body.data.reportData.report;
}
const fetchReport = code => gql(`query($code: String!) { reportData { report(code: $code) {
  title startTime
  fights(killType: All) { id encounterID name startTime endTime kill }
  masterData { actors(type: "Player") { id name subType } } } } }`, { code });

// Damage tables for many fights in one request each (GraphQL aliases), 20 fights per request
async function fetchDamageAll(code, fights, onProgress) {
  const out = {};
  for (let i = 0; i < fights.length; i += 20) {
    const chunk = fights.slice(i, i + 20);
    const parts = chunk.map(f =>
      `f${f.id}: table(dataType: DamageDone, fightIDs: [${f.id}], startTime: ${f.startTime}, endTime: ${f.endTime})`).join('\n');
    const r = await gql(`query($code: String!) { reportData { report(code: $code) { ${parts} } } }`, { code });
    chunk.forEach(f => {
      const t = r['f' + f.id] && (r['f' + f.id].data || r['f' + f.id]);
      out[f.id] = (t && t.entries) || [];
    });
    if (onProgress) onProgress(Math.min(i + 20, fights.length), fights.length);
  }
  return out;
}
// One paginated debuff-event stream across every fight, then split back out per fight
async function fetchEventsAll(code, fights, abilityID) {
  const ids = fights.map(f => f.id);
  const s0 = Math.min(...fights.map(f => f.startTime)), e0 = Math.max(...fights.map(f => f.endTime));
  const all = []; let start = s0;
  while (start != null) {
    const r = await gql(`query($code: String!, $fid: [Int]!, $s: Float!, $e: Float!, $ab: Float) {
      reportData { report(code: $code) {
        events(fightIDs: $fid, startTime: $s, endTime: $e, abilityID: $ab, dataType: Debuffs,
               hostilityType: Enemies, limit: 10000) { data nextPageTimestamp } } } }`,
      { code, fid: ids, s: start, e: e0, ab: abilityID });
    all.push(...(r.events.data || []));
    start = r.events.nextPageTimestamp;
  }
  const byFight = {};
  fights.forEach(f => { byFight[f.id] = []; });
  all.forEach(ev => {
    const f = ev.fight != null ? fights.find(x => x.id === ev.fight)
      : fights.find(x => ev.timestamp >= x.startTime && ev.timestamp <= x.endTime);
    if (f) byFight[f.id].push(ev);
  });
  return byFight;
}

/* ───────── scoring ───────── */
function analyzeSunders(events, fight, cfg) {
  const state = {}, useful = {}, usefulRaw = {}, wasted = {};
  const add = (m, k, v) => { m[k] = (m[k] || 0) + v; };
  events.slice().sort((a, b) => a.timestamp - b.timestamp).forEach(ev => {
    const key = ev.targetID + ':' + (ev.targetInstance || 0);
    const s = state[key] || (state[key] = { stacks: 0, last: 0 });
    const credit = (ev.timestamp - fight.startTime) < cfg.EARLY_WINDOW_S * 1000 ? cfg.EARLY_BONUS : 1;
    const good = () => { add(useful, ev.sourceID, credit); add(usefulRaw, ev.sourceID, 1); };
    if (ev.type === 'applydebuff') { s.stacks = 1; s.last = ev.timestamp; good(); }
    else if (ev.type === 'applydebuffstack') { s.stacks = ev.stack || s.stacks + 1; s.last = ev.timestamp; good(); }
    else if (ev.type === 'refreshdebuff') {
      if (s.stacks < 5 || ev.timestamp - s.last >= cfg.SUNDER_REFRESH_S * 1000) good();
      else add(wasted, ev.sourceID, 1);
      s.last = ev.timestamp;
    }
    else if (ev.type === 'removedebuffstack') s.stacks = ev.stack || Math.max(0, s.stacks - 1);
    else if (ev.type === 'removedebuff') delete state[key];
  });
  return { useful, usefulRaw, wasted };
}
function demoUptime(events, fight) {
  const open = {}, covered = {};
  events.slice().sort((a, b) => a.timestamp - b.timestamp).forEach(ev => {
    const key = ev.targetID + ':' + (ev.targetInstance || 0);
    if (ev.type === 'applydebuff' && open[key] == null) open[key] = ev.timestamp;
    else if (ev.type === 'removedebuff' && open[key] != null) {
      covered[key] = (covered[key] || 0) + ev.timestamp - open[key]; delete open[key];
    }
  });
  Object.keys(open).forEach(k => { covered[k] = (covered[k] || 0) + fight.endTime - open[k]; });
  const best = Math.max(0, ...Object.values(covered));
  return Math.min(1, best / (fight.endTime - fight.startTime));
}
function countBySource(events, type) {
  const out = {};
  events.forEach(ev => { if (ev.type === type) out[ev.sourceID] = (out[ev.sourceID] || 0) + 1; });
  return out;
}
function scoreReport(fights, warriors, cfg) {
  const acc = {};
  const get = n => acc[n] || (acc[n] = { name: n, dpsSum: 0, dpsDur: 0, rawDps: 0, sunder: 0, sunderDur: 0,
    usefulSunders: 0, wasted: 0, demo: 0, demoDur: 0, demoUp: 0, disarm: 0, disarmDur: 0, disarms: 0 });
  const idByName = {};
  Object.keys(warriors).forEach(id => { idByName[warriors[id]] = Number(id); });

  fights.forEach(fd => {
    const f = fd.fight, durS = (f.endTime - f.startTime) / 1000;
    if (durS <= 0) return;
    const dmg = {};
    fd.damage.forEach(e => { if (e.type === 'Warrior' && !cfg.TANKS.includes(e.name)) dmg[e.name] = e.total / durS; });
    const present = Object.keys(dmg);
    if (!present.length) return;
    const top = Math.max(...present.map(n => dmg[n]));
    const sun = analyzeSunders(fd.sunderEvents, f, cfg);
    const up = demoUptime(fd.demoEvents, f);
    const dis = fd.disarmEvents ? countBySource(fd.disarmEvents, 'applydebuff') : null;
    const pool = cfg.SUNDER_ASSIGNED.length ? present.filter(n => cfg.SUNDER_ASSIGNED.includes(n)) : present;
    const sunTarget = pool.length ? (5 + durS / cfg.SUNDER_REFRESH_S) / pool.length : 0;

    present.forEach(n => {
      const a = get(n), id = idByName[n];
      a.dpsSum += dmg[n] / top * 100 * durS; a.dpsDur += durS; a.rawDps += dmg[n] * durS;
      a.usefulSunders += sun.usefulRaw[id] || 0; a.wasted += sun.wasted[id] || 0;
      if (pool.includes(n) && sunTarget > 0) {
        a.sunder += Math.min(100, (sun.useful[id] || 0) / sunTarget * 100) * durS; a.sunderDur += durS;
      }
      if (cfg.DEMO_ASSIGNED.includes(n)) {
        a.demo += Math.min(100, up / cfg.DEMO_FULL_UPTIME * 100) * durS; a.demoDur += durS; a.demoUp += up * durS;
      }
      if (dis) {
        const k = dis[id] || 0;
        a.disarms += k; a.disarm += Math.min(100, k / cfg.DISARM_TARGET * 100) * durS; a.disarmDur += durS;
      }
    });
  });

  return Object.values(acc).map(a => {
    const comp = {
      dps: a.dpsDur ? a.dpsSum / a.dpsDur : null,
      sunder: a.sunderDur ? a.sunder / a.sunderDur : null,
      demo: a.demoDur ? a.demo / a.demoDur : null,
      disarm: a.disarmDur ? a.disarm / a.disarmDur : null,
    };
    let w = 0, t = 0;
    for (const k in comp) if (comp[k] !== null) { t += comp[k] * cfg.WEIGHTS[k]; w += cfg.WEIGHTS[k]; }
    return { name: a.name, score: w ? t / w : 0, components: comp, raw: {
      dps: a.dpsDur ? a.rawDps / a.dpsDur : 0, usefulSunders: a.usefulSunders, wastedSunders: a.wasted,
      demoUptime: a.demoDur ? a.demoUp / a.demoDur : null, disarms: a.disarmDur ? a.disarms : null } };
  }).sort((x, y) => y.score - x.score);
}

function setStatus(msg, err) { $('status').textContent = msg; $('status').className = 'status' + (err ? ' err' : ''); }
function reportCode(v) { const m = v.match(/reports\/([A-Za-z0-9]+)/); return m ? m[1] : v.trim(); }

function detailFor(key, r) {
  if (key === 'dps') return `${Math.round(r.dps).toLocaleString()} dps`;
  if (key === 'sunder') return `${r.usefulSunders} effective sunder${r.usefulSunders === 1 ? '' : 's'}`;

  if (key === 'disarm') return r.disarms !== null ? `${r.disarms} landed` : '';

}
function compRow(c, value, detail) {

function shortDetail(p) {

// Bonus structure (percent of the total pot). Edit here if the rules change.
const BONUS = {

    { key: 'Moon', label: '🌙 Moon Tank', pct: 0.75 },
    { key: 'Triangle', label: '🔺 Triangle Tank', pct: 0.20 },
    { key: 'Diamond', label: '🔶 Diamond Tank', pct: 0.20 },
    { key: 'Puller', label: '🎯 Puller & Marker', pct: 1 },
  ],
  dps: [1.25, 1.25, 1, 0.5, 0.5, 0.5], // Top 1–6 DPS
  healer: 0.25, healerMany: 0.20, healerManyAt: 12,
  rear: 0.10,                        // 4 Horsemen rear tanks, each
};
const CLASS_COLOR = { Warrior: '#C69B6D', Rogue: '#FFF468', Mage: '#3FC7EB', Warlock: '#8788EE', Hunter: '#AAD372',
  Priest: '#FFFFFF', Druid: '#FF7C0A', Paladin: '#F48CBA', Shaman: '#0070DD' };
let GK = null;
const gkSaved = () => { try { return JSON.parse(store.get('gk') || '{}'); } catch (e) { return {}; } };
const gkSave = patch => store.set('gk', JSON.stringify(Object.assign(gkSaved(), patch)));
const fmtG = n => Math.round(n).toLocaleString() + 'g';
const fmtP = n => (Math.round(n * 100) / 100) + '%';

async function fetchRoles(code, fights) {
  try {
    const bosses = fights.filter(f => f.encounterID);
    const use = bosses.length ? bosses : fights;
    const r = await gql(`query($code: String!, $ids: [Int]) { reportData { report(code: $code) {
      playerDetails(fightIDs: $ids) } } }`, { code, ids: use.map(f => f.id) });
    let pd = r.playerDetails || {};
    pd = (pd.data && pd.data.playerDetails) || pd.playerDetails || pd;
    const roles = {};
    (pd.tanks || []).forEach(p => { roles[p.name] = 'Tank'; });
    (pd.dps || []).forEach(p => { roles[p.name] = 'DPS'; });      // a DPS who off-tanked once stays DPS
    (pd.healers || []).forEach(p => { roles[p.name] = 'Healer'; });
    return roles;
  } catch (e) { return {}; }
}

function buildGdkp(data) {
  const saved = gkSaved();
  const rows = {};
  data.roster.forEach(p => {
    rows[p.name] = { name: p.name, cls: p.cls, dps: p.dps || 0, include: true,
      role: (saved.roles || {})[p.name] || p.role || 'DPS',
      admin: (saved.admin || []).includes(p.name), rear: (saved.rear || []).includes(p.name), extra: 0 };
  });
  const rank = { Tank: 0, Healer: 1, DPS: 2 };
  const order = Object.keys(rows).sort((a, b) => rank[rows[a].role] - rank[rows[b].role] || rows[b].dps - rows[a].dps || a.localeCompare(b));
  const slots = {};
  BONUS.slots.forEach(s => { const n = (saved.slots || {})[s.key]; slots[s.key] = n && rows[n] ? n : ''; });
  GK = { code: data.code, rows, order, slots, warriorOrder: data.warriorOrder || [], dpsBy: saved.dpsBy || 'raw' };

  const tankFirst = order.slice().sort((a, b) => (rows[a].role === 'Tank' ? 0 : 1) - (rows[b].role === 'Tank' ? 0 : 1));
  const slotHtml = BONUS.slots.map(s => `<div><label for="gk_${s.key}">${s.label}<b>${fmtP(s.pct)}</b></label>
    <select id="gk_${s.key}" data-slot="${s.key}"><option value="">—</option>${tankFirst.map(n =>
      `<option${slots[s.key] === n ? ' selected' : ''}>${esc(n)}</option>`).join('')}</select></div>`).join('');
  const rowHtml = order.map(n => { const r = rows[n]; return `<tr data-n="${esc(n)}">
    <td><input type="checkbox" class="inc" checked aria-label="Include ${esc(n)}"></td>
    <td class="pn"><div class="pg"><b style="color:${CLASS_COLOR[r.cls] || 'var(--text)'}">${esc(n)}</b><span class="gold">—</span></div>
      <small>${esc(r.cls || '')}${r.dps ? ' · ' + Math.round(r.dps).toLocaleString() + ' dps' : ''}</small><small class="bon"></small></td>
    <td><select class="role">${['DPS', 'Healer', 'Tank'].map(o => `<option${r.role === o ? ' selected' : ''}>${o}</option>`).join('')}</select></td>
    <td><input type="checkbox" class="adm"${r.admin ? ' checked' : ''} aria-label="Admin"></td>
    <td><input type="checkbox" class="rear"${r.rear ? ' checked' : ''} aria-label="4HM rear tank"></td>
    <td><input type="number" class="ext" step="0.05" placeholder="0" aria-label="Extra %"></td></tr>`; }).join('');

  let pot = ''; try { pot = store.get('gkpot_' + data.code) || ''; } catch (e) {}
  $('gdkp').innerHTML = `<div class="panel gk">
    <h2>💰 Gargul gold split</h2>
    <p class="lead">Fill in the pot and roles, then paste the result into Gargul. Bonuses come off the top; the rest is split evenly between everyone ticked.</p>
    <div class="row">
      <div><label for="gkPot">Total pot (gold)</label><input id="gkPot" type="number" inputmode="numeric" min="0" placeholder="e.g. 250000" value="${esc(pot)}"></div>
      <div><label for="gkDpsBy">Top 6 DPS bonus ranked by</label><select id="gkDpsBy">
        <option value="raw"${GK.dpsBy === 'raw' ? ' selected' : ''}>Raw DPS — all DPS players</option>
        <option value="score"${GK.dpsBy === 'score' ? ' selected' : ''}>Warrior Scorecard — warriors only</option></select></div>
    </div>
    <div class="gk-slots">${slotHtml}</div>
    <div class="gk-wrap"><table class="gk-t">
      <tr><th>In</th><th class="l">Player · gold</th><th>Role</th>
        <th class="tip bare" tabindex="0" data-tip="RL / Host / Auctioneer / ML — ${BONUS.admin}% shared between everyone ticked">Admin</th>
        <th class="tip bare" tabindex="0" data-tip="4 Horsemen rear tank — ${BONUS.rear}% each">4HM</th>
        <th class="tip bare" tabindex="0" data-tip="Extra % of the pot for this player (use a minus for a cut). For RL/host calls.">+%</th></tr>${rowHtml}</table></div>
    <div id="gkSum" class="gk-sum"></div>
    <div class="row">
      <button id="gkCopy">Copy for Gargul</button>
      <button id="gkCsv" class="ghost">Download spreadsheet</button>
    </div>
    <textarea id="gkOut" rows="6" readonly aria-label="Gargul import text"></textarea>
    <div class="hint">In game: <b>/gdkp</b> → pick the session → <b>Cuts</b> → <b>Import</b>, paste, Import. Gargul replaces every cut with this list, so anyone left out gets 0. Plain names work while everyone is still in your raid group.</div>
  </div>`;

  const panel = document.querySelector('.gk');
  const onEdit = e => {
    const t = e.target;
    if (t.id === 'gkPot') { try { store.set('gkpot_' + GK.code, t.value); } catch (x) {} }
    else if (t.id === 'gkDpsBy') { GK.dpsBy = t.value; gkSave({ dpsBy: t.value }); }
    else if (t.dataset.slot) {
      GK.slots[t.dataset.slot] = t.value;
      gkSave({ slots: Object.assign({}, gkSaved().slots, { [t.dataset.slot]: t.value }) });
    } else {
      const tr = t.closest('tr[data-n]'); if (!tr) return;
      const r = GK.rows[tr.dataset.n];
      if (t.classList.contains('inc')) { r.include = t.checked; tr.classList.toggle('off', !t.checked); }
      if (t.classList.contains('role')) { r.role = t.value; gkSave({ roles: Object.assign({}, gkSaved().roles, { [r.name]: t.value }) }); }
      if (t.classList.contains('ext')) r.extra = Number(t.value) || 0;
      if (t.classList.contains('adm') || t.classList.contains('rear')) {
        const key = t.classList.contains('adm') ? 'admin' : 'rear';
        r[key] = t.checked;
        const list = new Set(gkSaved()[key] || []);
        t.checked ? list.add(r.name) : list.delete(r.name);
        gkSave({ [key]: [...list] });
      }
    }
    gkRecalc();
  };
  panel.addEventListener('input', onEdit);
  panel.addEventListener('change', onEdit);
  $('gkCopy').onclick = gkCopy;
  $('gkCsv').onclick = gkDownload;
  gkRecalc();
}

function gkCompute() {
  const pot = Math.max(0, Number($('gkPot').value) || 0);
  const rows = GK.order.map(n => GK.rows[n]).filter(r => r.include);
  const B = {}; rows.forEach(r => { B[r.name] = []; });
  const add = (n, label, pct) => { if (B[n]) B[n].push({ label, pct }); };

  const admins = rows.filter(r => r.admin);
  admins.forEach(r => add(r.name, 'Admin', BONUS.admin / admins.length));
  BONUS.slots.forEach(s => { if (GK.slots[s.key]) add(GK.slots[s.key], s.label.replace(/^\S+\s/, ''), s.pct); });
  const healers = rows.filter(r => r.role === 'Healer');
  const hp = healers.length >= BONUS.healerManyAt ? BONUS.healerMany : BONUS.healer;
  healers.forEach(r => add(r.name, 'Healer', hp));
  rows.filter(r => r.rear).forEach(r => add(r.name, '4HM rear', BONUS.rear));

  const slotted = new Set(Object.values(GK.slots).filter(Boolean));
  const eligible = r => r && r.include && r.role === 'DPS' && !slotted.has(r.name);
  const pool = GK.dpsBy === 'score'
    ? GK.warriorOrder.map(n => GK.rows[n]).filter(eligible)
    : rows.filter(eligible).sort((a, b) => b.dps - a.dps);
  const topDps = pool.slice(0, BONUS.dps.length);
  topDps.forEach((r, i) => add(r.name, `Top ${i + 1} DPS`, BONUS.dps[i]));
  rows.forEach(r => { if (r.extra) add(r.name, (r.extra > 0 ? '+' : '') + r.extra + '% adj', r.extra); });

  const sumPct = list => list.reduce((t, b) => t + b.pct, 0);
  const totalPct = rows.reduce((t, r) => t + sumPct(B[r.name]), 0);
  const base = rows.length ? pot * (1 - totalPct / 100) / rows.length : 0;
  const out = rows.map(r => {
    const pct = sumPct(B[r.name]);
    return { name: r.name, cls: r.cls, role: r.role, pct, bonuses: B[r.name], base,
             bonusGold: pot * pct / 100, gold: Math.max(0, Math.floor(base + pot * pct / 100)) };
  });
  const paid = out.reduce((t, o) => t + o.gold, 0);
  return { pot, out, totalPct, base, healers: healers.length, hp, topDps, leftover: pot - paid };
}

function gkRecalc() {
  const c = gkCompute(), by = {};
  c.out.forEach(o => { by[o.name] = o; });
  document.querySelectorAll('.gk-t tr[data-n]').forEach(tr => {
    const o = by[tr.dataset.n], g = tr.querySelector('.gold'), bon = tr.querySelector('.bon');
    if (!o) { g.textContent = '—'; bon.textContent = 'not included'; return; }
    g.textContent = c.pot ? fmtG(o.gold) : '—';
    bon.textContent = o.bonuses.map(b => `${b.label} ${fmtP(b.pct)}`).join(' · ');
  });
  const warn = [];
  if (!c.pot) warn.push('Enter the total pot to see gold amounts.');
  if (c.totalPct >= 100) warn.push('Bonuses add up to 100% or more of the pot.');
  BONUS.slots.forEach(s => { const n = GK.slots[s.key]; if (n && GK.rows[n] && !GK.rows[n].include) warn.push(`${n} (${s.label.replace(/^\S+\s/, '')}) isn't included.`); });
  $('gkSum').innerHTML = `<b>${c.out.length}</b> raiders · bonuses <b>${fmtP(c.totalPct)}</b>${c.pot ? ` (${fmtG(c.pot * c.totalPct / 100)})` : ''}
    · everyone's base share <b>${c.pot ? fmtG(c.base) : '—'}</b><br>
    ${c.healers} healers at ${fmtP(c.hp)} each · Top DPS: ${c.topDps.map((r, i) => `${i + 1}. ${esc(r.name)}`).join(', ') || '—'}
    ${c.pot && c.leftover > 0 ? `<br>Rounding leaves ${fmtG(c.leftover)} unassigned.` : ''}
    ${warn.length ? `<br><span class="warn">${warn.map(esc).join(' ')}</span>` : ''}`;
  $('gkOut').value = c.pot ? 'Player,Gold\n' + c.out.map(o => `${o.name},${o.gold}`).join('\n') : '';
  return c;
}

function gkCopy() {
  const txt = $('gkOut').value;
  if (!txt) return setStatus('Enter the total pot first.', true);
  const done = () => { $('gkCopy').textContent = 'Copied ✓'; setTimeout(() => { $('gkCopy').textContent = 'Copy for Gargul'; }, 1500); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, () => { $('gkOut').select(); document.execCommand('copy'); done(); });
  else { $('gkOut').select(); document.execCommand('copy'); done(); }
}

function gkDownload() {
  const c = gkCompute();
  if (!c.pot) return setStatus('Enter the total pot first.', true);
  const clean = v => String(v).replace(/[,\n"]/g, ' ');
  const lines = ['Player,Gold,Class,Role,Base,Bonus %,Bonus Gold,Bonuses'].concat(c.out.map(o => [
    o.name, o.gold, o.cls || '', o.role, Math.floor(o.base), Math.round(o.pct * 100) / 100, Math.floor(o.bonusGold),
    o.bonuses.map(b => `${b.label} ${fmtP(b.pct)}`).join(' + '),
  ].map(clean).join(',')));
  const blob = new Blob([lines.join('\n') + '\n'], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `gargul-cuts-${GK.code}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

async function run() {
  const code = reportCode($('report').value);
  if (!code) return setStatus('Paste a report URL or code.', true);
  store.set('report', $('report').value);
  const site = $('report').value.match(/https?:\/\/(vanilla|classic|fresh|sod)\.warcraftlogs\.com/);
  if (site) { $('host').value = 'https://' + site[1] + '.warcraftlogs.com'; store.set('host', $('host').value); }
  const cfg = Object.assign({}, CFG, {
    TANKS: names($('tanks').value), SUNDER_ASSIGNED: names($('sunder').value), DEMO_ASSIGNED: names($('demo').value),
    DISARM_TARGET: Number($('disarmTarget').value) || 1,
  });
  $('runBtn').disabled = true; $('results').innerHTML = ''; $('gdkp').innerHTML = '';
  try {
    setStatus('Loading report…');
    const rep = await fetchReport(code);
    const warriors = {};
    rep.masterData.actors.filter(a => a.subType === 'Warrior').forEach(a => { warriors[a.id] = a.name; });
    const set = $('fightSet').value;
    const isTrash = f => !f.encounterID;
    const picked = rep.fights.filter(f => {
      if (f.endTime <= f.startTime) return false;
      if (set === 'trash') return isTrash(f);
      if (set === 'kills') return !isTrash(f) && f.kill;
      if (set === 'all') return true;
      return isTrash(f) || f.kill; // kills + trash
    });
    if (!picked.length) return setStatus('No matching fights found in this report.', true);
    const bosses = picked.filter(f => !isTrash(f)).length, trash = picked.length - bosses;

    const dmg = await fetchDamageAll(code, picked, (n, t) => setStatus(`Loading damage… ${n}/${t} pulls`));
    setStatus('Loading Sunder Armor, Demo Shout & Disarm…');
    const [sun, demo, dis] = await Promise.all([
      fetchEventsAll(code, picked, cfg.SPELLS.sunder),
      fetchEventsAll(code, picked, cfg.SPELLS.demo),
      fetchEventsAll(code, picked, cfg.SPELLS.disarm),
    ]);
    const fights = picked.map(f => ({
      fight: f, damage: dmg[f.id] || [], sunderEvents: sun[f.id] || [], demoEvents: demo[f.id] || [],
      disarmEvents: dis[f.id] || [],
    }));
    setStatus('Loading raid roles…');
    const roles = await fetchRoles(code, picked);
    const ranked = scoreReport(fights, warriors, cfg);
    if (ranked.length) render({ title: rep.title, startTime: rep.startTime, bosses, trash }, ranked, Number($('topN').value) || 6);
    else $('results').innerHTML = '<p class="sub">No DPS warriors found in these fights.</p>';

    // Raw DPS for every player across the analyzed fights, for the gold split
    const totalS = picked.reduce((t, f) => t + (f.endTime - f.startTime) / 1000, 0);
    const dmgBy = {};
    picked.forEach(f => (dmg[f.id] || []).forEach(e => { dmgBy[e.name] = (dmgBy[e.name] || 0) + (e.total || 0); }));
    const roster = rep.masterData.actors.map(a => ({ name: a.name, cls: a.subType,
      role: roles[a.name] || (a.subType === 'Priest' ? 'Healer' : 'DPS'), dps: totalS ? (dmgBy[a.name] || 0) / totalS : 0 }));
    buildGdkp({ code, roster, warriorOrder: ranked.map(r => r.name) });
    setStatus('');
  } catch (e) {
    setStatus(e.message, true);
  } finally {
    $('runBtn').disabled = false;
  }
}
$('runBtn').onclick = run;

// Preview with sample data: add ?demo to the page URL
if (new URLSearchParams(location.search).has('demo')) {
  const mk = (name, s, d, su, de, w, dz) => ({ name, score: s,
    components: { dps: d, sunder: su, demo: de, disarm: dz },
    raw: { dps: d * 11, usefulSunders: Math.round((su || 0) / 6), wastedSunders: w, demoUptime: de !== null ? de * .009 : null, disarms: Math.round(dz / 10) } });
  render({ title: 'Sample raid (demo data)', startTime: Date.now(), bosses: 9, trash: 42 }, [
    mk('Ironjaw', 95.9, 98, 92, null, 0, 90), mk('Grimtusk', 91.7, 100, 74, null, 0, 80), mk('Valebreaker', 89.8, 85, 96, 98, 0, 100), mk('Stonefist', 78.6, 90, 55, null, 0, 60), mk('Ashcleaver', 65.2, 82, 30, null, 0, 40), mk('Rustblade', 47.1, 64, 12, null, 0, 20),
  ], 6);
  const demoRoster = [];
  const add = (cls, role, list) => list.forEach((n, i) => demoRoster.push({ name: n, cls, role, dps: role === 'DPS' ? 1150 - demoRoster.length * 9 - i * 3 : 0 }));
  add('Warrior', 'Tank', ['Bulwark', 'Shieldwall', 'Taunton', 'Bastion', 'Aegis', 'Rampart']);
  add('Warrior', 'DPS', ['Grimtusk', 'Ironjaw', 'Valebreaker', 'Stonefist', 'Ashcleaver', 'Rustblade', 'Gorehowl', 'Skullsplit']);
  add('Rogue', 'DPS', ['Shivv', 'Nightblade', 'Quickstab', 'Duskfang', 'Venomtip']);
  add('Mage', 'DPS', ['Frostbyte', 'Pyrolis', 'Arcanyx', 'Blinkz', 'Sheepish']);
  add('Warlock', 'DPS', ['Felix', 'Doomcaller', 'Shadowbolt']);
  add('Hunter', 'DPS', ['Tranqshot', 'Petlover']);
  add('Priest', 'Healer', ['Lightwell', 'Renewal', 'Holynova', 'Fortitude', 'Penance']);
  add('Paladin', 'Healer', ['Hammerfall', 'Blessington', 'Holyshock']);
  add('Druid', 'Healer', ['Rejuvia', 'Barkskin', 'Treeform']);
  buildGdkp({ code: 'demo', roster: demoRoster, warriorOrder: ['Ironjaw', 'Grimtusk', 'Valebreaker', 'Stonefist', 'Ashcleaver', 'Rustblade'] });
}

if (!RELAY_URL) setStatus('Relay not set up yet — see setup steps.', true);
</script>
